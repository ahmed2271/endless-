name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APKs and run unit tests
        run: ./gradlew --stacktrace assembleDebug assembleRelease testDebugUnitTest

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: liftlog-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
