name: Opt → SP → TDDFT
description: Optimization check from Opt; energy, orbitals, dipole and Hirshfeld/MBIS charges from SP; excited states from TDDFT.
calc_profile: opt_sp_tddft
version: 1
fields:
- {id: optconv_Opt, name: Opt converged, kind: builtin, builtin: opt_converged, source: {mode: step_name, value: Opt}}
- {id: E_Opt, name: Energy (Opt), kind: builtin, builtin: final_energy, source: {mode: step_name, value: Opt}, unit: Eh}
- {id: E_SP, name: Energy (SP), kind: builtin, builtin: final_energy, source: {mode: step_name, value: SP}, unit: Eh}
- {id: HOMO_SP, name: HOMO (SP), kind: builtin, builtin: homo, source: {mode: step_name, value: SP}, unit: eV}
- {id: LUMO_SP, name: LUMO (SP), kind: builtin, builtin: lumo, source: {mode: step_name, value: SP}, unit: eV}
- {id: gap_SP, name: Gap (SP), kind: builtin, builtin: gap, source: {mode: step_name, value: SP}, unit: eV}
- {id: dipole_SP, name: Dipole (SP), kind: builtin, builtin: dipole, source: {mode: step_name, value: SP}, unit: Debye}
- {id: q_hirshfeld_SP, name: Hirshfeld charges (SP), kind: builtin, builtin: charges, params: {scheme: hirshfeld}, source: {mode: step_name, value: SP}}
- {id: q_mbis_SP, name: MBIS charges (SP), kind: builtin, builtin: charges, params: {scheme: mbis}, source: {mode: step_name, value: SP}}
- {id: S1_TDDFT, name: S1 (TDDFT), kind: builtin, builtin: s1_energy, source: {mode: step_name, value: TDDFT}, unit: eV}
- {id: S1_nm_TDDFT, name: S1 wavelength (TDDFT), kind: builtin, builtin: s1_energy, source: {mode: step_name, value: TDDFT}, unit: nm, decimals: 1}
- {id: S1_f_TDDFT, name: S1 f (TDDFT), kind: builtin, builtin: s1_fosc, source: {mode: step_name, value: TDDFT}, decimals: 4}
- {id: bright_TDDFT, name: Brightest state (TDDFT), kind: builtin, builtin: brightest, params: {nm_min: 250, nm_max: 800}, source: {mode: step_name, value: TDDFT}, unit: nm, decimals: 1}
- {id: states_TDDFT, name: Excited states (TDDFT), kind: builtin, builtin: excited_states, source: {mode: step_name, value: TDDFT}}
